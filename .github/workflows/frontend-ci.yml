name: Frontend CI

# Pull-request gate for the frontend: type-check, lint, unit tests, and build.
# This is the check that keeps `main` green — before this workflow the unit tests
# ran nowhere (tsconfig excludes tests; the deploy workflow stubbed the test step).

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

# Cancel superseded runs on the same PR branch.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generated event types are required before `tsc` runs (build does this too,
      # but `typecheck` runs bare `tsc --noEmit` and would fail without them).
      - name: Generate types
        run: npm run sync-schemas

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
