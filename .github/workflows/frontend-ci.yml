name: Frontend CI

# Pull-request gate for the frontend: type-check, lint, unit tests, and build.
# This is the check that keeps `main` green — before this workflow the unit tests
# ran nowhere (tsconfig excludes tests; the deploy workflow stubbed the test step).
#
# NOTE: this job is intended to be a REQUIRED status check. It therefore triggers on
# EVERY pull request with NO `paths:` filter — a path-filtered workflow is *skipped*
# on PRs that don't touch frontend/, and a skipped required check never reports,
# which wedges the merge box. Instead we always run (so the check always reports) and
# gate the expensive steps on whether frontend / CI files actually changed.

# Also runs on direct pushes to `main`. Branch protection requires this check on
# `main`, but a workflow that only triggers on `pull_request` produces no run for
# a direct push — so the required check never reports and the push must be
# force-merged with "Bypassed rule violations". Docs-only commits (card edits,
# closeouts) hit that routinely. Running here too means the check always reports;
# the change-detection step below keeps it a cheap no-op when nothing relevant
# changed. See dev/active/gate-prs-on-edge-function-deno-lint.md.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect frontend changes
        id: changes
        working-directory: .
        run: |
          # The two events carry the diff range in different places; a push has no
          # `pull_request` payload, so reading base.sha there yields empty strings
          # and `git diff "" ""` fails.
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
            HEAD='${{ github.event.pull_request.head.sha }}'
          else
            BASE='${{ github.event.before }}'
            HEAD='${{ github.sha }}'
            # `before` is all-zeros on a branch's first push, and points at a
            # discarded commit after a force-push. Either way it is not a
            # resolvable object — fall back to the single-commit diff.
            if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE="${HEAD}^"
            fi
          fi

          if git diff --name-only "$BASE" "$HEAD" \
              | grep -qE '^(frontend/|\.github/workflows/frontend-ci\.yml)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "No frontend or CI changes in $BASE..$HEAD — skipping checks (job still reports success)."
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci

      # Generated event types are required before `tsc` runs (build does this too,
      # but `typecheck` runs bare `tsc --noEmit` and would fail without them).
      - name: Generate types
        if: steps.changes.outputs.frontend == 'true'
        run: npm run sync-schemas

      - name: Type-check
        if: steps.changes.outputs.frontend == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.changes.outputs.frontend == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.changes.outputs.frontend == 'true'
        run: npm run test

      - name: Build
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build
